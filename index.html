<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大悲精舍 · Dabei Vihara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+TC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#F7F0DE;--cream-soft:#FBF6E8;--parchment:#EFE4C8;--surface:#F7F0DE;--surface-soft:#FBF6E8;--surface-dark:#3D2413;--wood-deep:#3D2413;--wood-dark:#5C3A1F;--wood-mid:#8B5A2B;--wood-warm:#A87C52;--wood-red:#6D3A1A;--gold:#C9A961;--gold-bright:#D4AF37;--gold-soft:#E8CB84;--ink:#2B1D10;--ink-soft:#4A3B2A;--text:#2B1D10;--text-soft:#4A3B2A;--text-muted:#8B5A2B;--accent:#6D3A1A;--line:rgba(201,169,97,0.35);--line-strong:rgba(139,90,43,0.25);--ring:rgba(201,169,97,0.5)}
[data-theme="paper"]{--cream:#F5EFE2;--cream-soft:#F9F4E7;--parchment:#EBE3CC;--surface:#F5EFE2;--surface-soft:#F9F4E7;--surface-dark:#2A241B;--wood-deep:#2A241B;--wood-dark:#3D3428;--wood-mid:#6B5D48;--wood-warm:#8B7B5F;--wood-red:#5C4A2E;--gold:#B09B6A;--gold-bright:#C1A868;--gold-soft:#D4C18A;--ink:#1F1A12;--ink-soft:#3D3428;--text:#1F1A12;--text-soft:#3D3428;--text-muted:#6B5D48;--accent:#5C4A2E;--line:rgba(107,93,72,0.25);--line-strong:rgba(42,36,27,0.2);--ring:rgba(176,155,106,0.4)}
[data-theme="crimson"]{--cream:#F4E9D8;--cream-soft:#F8F0DD;--parchment:#E8D6B2;--surface:#F4E9D8;--surface-soft:#F8F0DD;--surface-dark:#4A1010;--wood-deep:#4A1010;--wood-dark:#6B1818;--wood-mid:#8A2626;--wood-warm:#A84040;--wood-red:#8A1818;--gold:#C9A961;--gold-bright:#D4AF37;--gold-soft:#E8CB84;--ink:#2E0808;--ink-soft:#4A1818;--text:#2E0808;--text-soft:#4A1818;--text-muted:#8A2626;--accent:#8A1818;--line:rgba(201,169,97,0.4);--line-strong:rgba(138,24,24,0.25);--ring:rgba(201,169,97,0.55)}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{font-family:'Noto Serif TC','EB Garamond',Georgia,serif;background:var(--surface);color:var(--text);line-height:1.8;font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .6s,color .6s}
body[data-lang="zh-Hans"]{font-family:'Noto Serif SC','Noto Serif TC',Georgia,serif}
body[data-lang="en"]{font-family:'EB Garamond','Noto Serif TC',Georgia,serif}
a{text-decoration:none;color:inherit}ul{list-style:none}img{max-width:100%;display:block}
.container{max-width:1240px;margin:0 auto;padding:0 40px}
/* Mural */
.mural-banner{position:relative;width:100%;background:var(--surface-dark);overflow:hidden;line-height:0;border-bottom:3px solid var(--gold)}
.mural-banner img{width:100%;height:auto;display:block}
.mural-banner .caption{position:absolute;right:28px;bottom:20px;font-family:'Noto Serif TC',serif;font-weight:500;font-size:14px;letter-spacing:10px;color:rgba(255,240,200,.95);text-shadow:0 2px 8px rgba(0,0,0,.7);padding:8px 18px;background:rgba(61,36,19,.6);backdrop-filter:blur(6px);border:1px solid rgba(201,169,97,.5);line-height:1.6}
/* Ornaments */
.lotus-divider{display:flex;align-items:center;justify-content:center;gap:20px;margin:0 auto;width:100%;max-width:280px}
.lotus-divider .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 50%,transparent)}
.lotus-divider svg{width:26px;height:26px;color:var(--gold);flex-shrink:0}
.eyebrow{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:14px;letter-spacing:6px;text-transform:uppercase;color:var(--wood-mid);display:block;margin-bottom:14px}
h2.section-title{font-family:'Noto Serif TC',serif;font-weight:500;font-size:clamp(28px,4vw,42px);letter-spacing:14px;color:var(--wood-deep);text-align:center;margin-bottom:8px;padding-left:14px}
h2.section-title .en{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:18px;letter-spacing:4px;color:var(--wood-warm);margin-top:10px;padding-left:0}
body[data-lang="en"] h2.section-title{letter-spacing:4px;padding-left:0}
/* Topbar */
.topbar{background:var(--surface-dark);color:var(--gold-soft);font-size:12px;letter-spacing:3px;padding:9px 0}
.topbar-inner{max-width:1240px;margin:0 auto;padding:0 40px;display:flex;justify-content:space-between;align-items:center}
.topbar-inner .left span::before{content:'';display:inline-block;width:6px;height:6px;background:var(--gold);border-radius:50%;margin-right:10px;transform:translateY(-1px)}
.topbar-right{display:flex;gap:22px;align-items:center}
.topbar-right a{transition:color .3s}.topbar-right a:hover{color:var(--cream)}
.lang-toggle{display:flex;gap:8px;user-select:none}
.lang-toggle span{opacity:.5;cursor:pointer;transition:opacity .3s,color .3s}
.lang-toggle span:not(.sep):hover{opacity:.9}
.lang-toggle span.active{opacity:1;color:var(--cream)}
.lang-toggle .sep{opacity:.3;cursor:default}
/* Header */
header{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-wrap{max-width:1240px;margin:0 auto;padding:18px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{display:flex;align-items:center;gap:14px;cursor:pointer}
.logo-mark{width:38px;height:38px;color:var(--wood-deep);flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;background:var(--cream-soft)}
.logo-mark svg{width:24px;height:24px}
.logo-text{line-height:1}
.logo-text .cn{font-family:'Noto Serif TC',serif;font-weight:500;font-size:24px;letter-spacing:8px;color:var(--wood-deep)}
.logo-text .en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;letter-spacing:4px;color:var(--wood-warm);margin-top:6px;text-transform:uppercase;text-align:center}
nav ul{display:flex;gap:28px}
nav li a{font-size:14px;letter-spacing:3px;color:var(--text);position:relative;padding:6px 0;transition:color .3s;cursor:pointer}
nav li a::after{content:'';position:absolute;bottom:-4px;left:50%;width:0;height:1px;background:var(--gold);transition:all .4s}
nav li a:hover,nav li a.active{color:var(--wood-red)}
nav li a:hover::after,nav li a.active::after{width:100%;left:0}
.menu-btn{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:8px}
.menu-btn span{display:block;width:24px;height:1px;background:var(--wood-deep)}
/* Hero */
.hero{position:relative;padding:100px 0 130px;overflow:hidden;background:radial-gradient(ellipse 900px 500px at 85% 40%,color-mix(in srgb,var(--gold-soft) 40%,transparent),transparent 70%),radial-gradient(ellipse 600px 400px at 10% 80%,color-mix(in srgb,var(--gold) 18%,transparent),transparent 70%),linear-gradient(175deg,var(--surface-soft) 0%,var(--surface) 60%,var(--parchment) 100%)}
.hero::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,transparent 0 60px,color-mix(in srgb,var(--wood-red) 3%,transparent) 60px 61px,transparent 61px 62px);pointer-events:none}
.hero::after{content:'';position:absolute;right:-220px;top:50%;transform:translateY(-50%);width:720px;height:720px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='%23C9A961' stroke-width='0.4' stroke-linecap='round'><circle cx='50' cy='50' r='44'/><circle cx='50' cy='50' r='30'/><circle cx='50' cy='50' r='6'/><circle cx='50' cy='50' r='2.5' fill='%23C9A961' stroke='none'/><line x1='50' y1='6' x2='50' y2='20'/><line x1='50' y1='80' x2='50' y2='94'/><line x1='6' y1='50' x2='20' y2='50'/><line x1='80' y1='50' x2='94' y2='50'/></g></svg>");background-repeat:no-repeat;background-position:center;opacity:.14;pointer-events:none;animation:gentleSpin 240s linear infinite}
@keyframes gentleSpin{from{transform:translateY(-50%) rotate(0deg)}to{transform:translateY(-50%) rotate(360deg)}}
.hero-inner{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 40px;display:grid;grid-template-columns:1.05fr .95fr;gap:70px;align-items:center}
.hero-text .small-label{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;letter-spacing:6px;color:var(--wood-mid);text-transform:uppercase;margin-bottom:28px;display:flex;align-items:center;gap:14px}
.hero-text .small-label::before{content:'';width:40px;height:1px;background:var(--gold);display:inline-block}
.hero-text .small-label .cn{font-family:'Noto Serif TC',serif;font-style:normal;font-size:14px;letter-spacing:5px;color:var(--wood-deep);font-weight:500}
.hero-text .small-label .dot{opacity:.55}
.hero-text h1{font-family:'Noto Serif TC',serif;font-weight:500;font-size:clamp(26px,3.2vw,38px);line-height:1.6;color:var(--wood-deep);letter-spacing:3px;margin-bottom:34px}
.dharma-quote{position:relative;padding:20px 0 20px 32px;border-left:2px solid var(--gold);margin-bottom:36px}
.dharma-quote::before{content:'「';position:absolute;top:-10px;left:-6px;font-family:'Noto Serif TC',serif;font-size:58px;color:var(--gold);opacity:.45;line-height:1}
body[data-lang="en"] .dharma-quote::before{content:'"';font-family:'EB Garamond',serif;font-size:70px;top:-26px}
.dharma-quote p{font-size:16px;line-height:2.1;color:var(--ink-soft);letter-spacing:2px;font-weight:400}
body[data-lang="en"] .dharma-quote p{letter-spacing:.2px;font-size:17px;line-height:1.8}
.dharma-quote p .accent{color:var(--wood-red);font-weight:500}
.dharma-quote cite{display:block;margin-top:22px;font-style:normal;font-size:13px;letter-spacing:4px;color:var(--wood-mid)}
.hero-meta{display:flex;align-items:center;gap:32px;padding-top:32px;border-top:1px solid var(--line)}
.meta-item{display:flex;flex-direction:column;gap:4px}
.meta-num{font-family:'Noto Serif TC',serif;font-weight:500;font-size:20px;letter-spacing:3px;color:var(--wood-deep)}
.meta-label{font-size:12px;letter-spacing:3px;color:var(--wood-mid)}
.meta-sep{width:1px;height:36px;background:var(--line)}
.hero-image{position:relative;width:100%;display:flex;flex-direction:column;align-items:center}
.hero-image img{width:100%;height:auto;box-shadow:0 30px 60px -20px rgba(61,36,19,.45),0 0 0 1px rgba(201,169,97,.35),0 0 0 10px var(--surface),0 0 0 11px var(--gold)}
.hero-image-caption{margin-top:28px;font-family:'Noto Serif TC',serif;font-size:13px;letter-spacing:8px;color:var(--wood-mid);padding-left:8px}
/* Sections */
section{padding:110px 0;position:relative}
.section-head{text-align:center;margin-bottom:70px}
.section-head .lotus-divider{margin-top:22px}
/* News */
.news-section{background:var(--cream-soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.news-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:32px}
.news-card{background:var(--surface);border:1px solid var(--line);overflow:hidden;transition:transform .5s,box-shadow .5s,border-color .4s;display:flex;flex-direction:column;position:relative;cursor:pointer}
.news-card:hover{transform:translateY(-6px);box-shadow:0 28px 50px -24px rgba(93,58,31,.35);border-color:var(--gold)}
.news-arch{height:180px;background:radial-gradient(circle at 50% 70%,rgba(255,220,130,.5),transparent 60%),linear-gradient(180deg,var(--wood-red) 0%,var(--wood-mid) 50%,var(--wood-dark) 100%);position:relative;overflow:hidden}
.news-arch::before{content:'';position:absolute;top:18px;left:50%;transform:translateX(-50%);width:60%;height:calc(100% - 26px);background:linear-gradient(180deg,var(--cream-soft) 0%,var(--parchment) 100%);border-radius:60px 60px 0 0}
.news-arch::after{content:'';position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C9A961' stroke-width='0.7'><path d='M12 3 C9 7 9 11 12 14 C15 11 15 7 12 3 Z'/><path d='M5 10 C5 14 8 17 12 17 C16 17 19 14 19 10 C17 12 14 13 12 13 C10 13 7 12 5 10 Z'/></svg>");background-repeat:no-repeat;background-position:center;background-size:contain}
.news-arch[data-kind="teachings"]::after{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C9A961' stroke-width='0.7'><path d='M4 6 h16 v12 h-16 z'/><path d='M12 6 v12'/><path d='M6 9 h4 M6 12 h4 M14 9 h4 M14 12 h4'/></svg>")}
.news-arch[data-kind="retreat"]::after{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C9A961' stroke-width='0.7'><circle cx='12' cy='12' r='8'/><circle cx='12' cy='12' r='2' fill='%23C9A961'/><path d='M12 4v2 M12 18v2 M4 12h2 M18 12h2'/></svg>")}
.news-arch[data-kind="scripture"]::after{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C9A961' stroke-width='0.7'><path d='M5 4 v16 l3-2 l4 2 l4-2 l3 2 v-16 l-3 2 l-4-2 l-4 2 z'/><path d='M9 9h6 M9 12h6 M9 15h4'/></svg>")}
.news-body{padding:24px 26px 28px;flex:1;display:flex;flex-direction:column}
.news-date{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:3px;color:var(--gold-bright);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.news-date::after{content:'';flex:1;height:1px;background:var(--line-strong)}
.news-tag{display:inline-flex;align-items:center;padding:3px 10px;font-size:11px;letter-spacing:4px;color:var(--wood-mid);border:1px solid var(--line);background:var(--cream-soft);margin-bottom:14px;align-self:flex-start}
.news-tag.hot{color:var(--wood-red);border-color:color-mix(in srgb,var(--wood-red) 30%,transparent);background:color-mix(in srgb,var(--wood-red) 6%,var(--cream-soft))}
.news-title{font-family:'Noto Serif TC',serif;font-weight:500;font-size:16px;line-height:1.7;letter-spacing:2px;color:var(--wood-deep);margin-bottom:14px;flex:1}
.news-excerpt{font-size:13px;line-height:1.8;color:var(--ink-soft);letter-spacing:1px;opacity:.85}
.news-more{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;letter-spacing:3px;color:var(--wood-mid);margin-top:18px;text-transform:uppercase;transition:color .3s,letter-spacing .3s}
.news-card:hover .news-more{color:var(--wood-red);letter-spacing:4px}
.view-all{text-align:center;margin-top:64px}
.view-all a{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;letter-spacing:5px;color:var(--wood-mid);border-bottom:1px solid var(--gold);padding-bottom:6px;transition:all .3s;cursor:pointer}
.view-all a:hover{color:var(--wood-red);letter-spacing:7px}
/* Q&A */
.qa-section{background:var(--surface)}
.qa-section::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,transparent 0 80px,color-mix(in srgb,var(--wood-mid) 2%,transparent) 80px 81px,transparent 81px 82px);pointer-events:none}
.qa-list{max-width:940px;margin:0 auto;position:relative}
.qa-item{border-bottom:1px solid var(--line);transition:background .4s}
.qa-item:first-child{border-top:1px solid var(--line)}
.qa-item.open{background:color-mix(in srgb,var(--gold-soft) 10%,transparent)}
.qa-row{padding:28px 0;display:grid;grid-template-columns:130px 1fr auto;gap:40px;align-items:start;cursor:pointer}
.qa-date{font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:3px;color:var(--gold-bright);padding-top:10px;padding-left:6px}
.qa-content{position:relative;padding-left:44px}
.qa-q-mark,.qa-a-mark{position:absolute;left:0;top:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif TC',serif;font-weight:500;font-size:13px;color:var(--gold-bright);border:1px solid var(--gold);border-radius:50%;background:var(--surface)}
.qa-a-mark{color:var(--cream);background:var(--wood-deep);border-color:var(--wood-deep)}
.qa-content h3{font-family:'Noto Serif TC',serif;font-weight:500;font-size:18px;line-height:1.7;letter-spacing:2px;color:var(--wood-deep);margin-bottom:8px}
.qa-preview{font-size:14px;color:var(--ink-soft);letter-spacing:1px;line-height:1.9;opacity:.82}
.qa-arrow{width:36px;height:36px;border:1px solid var(--line-strong);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--wood-mid);transition:all .4s;flex-shrink:0;margin-top:10px;background:transparent;cursor:pointer}
.qa-arrow svg{width:14px;height:14px;transition:transform .4s}
.qa-row:hover .qa-arrow,.qa-item.open .qa-arrow{background:var(--wood-deep);color:var(--gold-soft);border-color:var(--wood-deep)}
.qa-item.open .qa-arrow svg{transform:rotate(180deg)}
.qa-answer{overflow:hidden;transition:max-height .6s ease,padding .4s;padding-left:calc(130px + 40px + 44px);padding-right:76px;position:relative;max-height:0}
.qa-item.open .qa-answer{max-height:400px;padding-bottom:32px}
.qa-answer .qa-a-mark{left:calc(130px + 40px);top:0}
.qa-answer p{font-size:15px;color:var(--ink-soft);letter-spacing:1.5px;line-height:2}
/* Affinity */
.affinity{padding:130px 0;background:linear-gradient(180deg,color-mix(in srgb,var(--surface-dark) 95%,transparent),color-mix(in srgb,var(--surface-dark) 95%,transparent)),repeating-linear-gradient(90deg,var(--wood-dark) 0px,var(--wood-dark) 14px,var(--wood-deep) 14px,var(--wood-deep) 16px,var(--wood-red) 16px,var(--wood-red) 32px,var(--wood-dark) 32px,var(--wood-dark) 34px);color:var(--cream);text-align:center;position:relative;overflow:hidden}
.affinity::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:600px;height:600px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%23C9A961' stroke-width='0.3' opacity='0.5'><circle cx='50' cy='50' r='45'/><circle cx='50' cy='50' r='36'/><circle cx='50' cy='50' r='28'/></svg>");background-repeat:no-repeat;background-position:center;opacity:.35}
.affinity-inner{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 40px}
.affinity .eyebrow{color:var(--gold-soft)}
.affinity h2{font-family:'Noto Serif TC',serif;font-weight:400;font-size:clamp(28px,3.4vw,40px);letter-spacing:10px;color:var(--cream);margin:20px 0 30px;line-height:1.5;padding-left:10px}
.affinity p{font-size:16px;line-height:2;color:rgba(247,240,222,.8);letter-spacing:2px;margin-bottom:48px}
.affinity-buttons{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.btn-gold,.btn-ghost{font-family:'Noto Serif TC',serif;font-size:15px;letter-spacing:6px;padding:18px 42px;display:inline-flex;align-items:center;gap:14px;transition:all .4s;cursor:pointer;border:1px solid;text-decoration:none}
.btn-gold{background:var(--gold);color:var(--wood-deep);border-color:var(--gold)}
.btn-gold:hover{background:var(--gold-bright);border-color:var(--gold-bright);transform:translateY(-2px);box-shadow:0 14px 30px -8px rgba(212,175,55,.45)}
.btn-ghost{background:transparent;color:var(--gold-soft);border-color:rgba(232,203,132,.5)}
.btn-ghost:hover{border-color:var(--gold-soft);background:rgba(232,203,132,.08);transform:translateY(-2px)}
/* Footer */
footer{background:var(--surface-dark);color:#B8A283;padding:80px 0 30px;font-size:14px;letter-spacing:1.5px}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:60px;padding-bottom:60px;border-bottom:1px solid rgba(201,169,97,.15)}
footer h4{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;letter-spacing:5px;color:var(--gold-soft);margin-bottom:24px;text-transform:uppercase}
.footer-brand .brand-title{margin-bottom:22px}
.footer-brand .cn{font-family:'Noto Serif TC',serif;font-size:24px;letter-spacing:8px;color:var(--cream);font-weight:500}
.footer-brand .en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;letter-spacing:5px;color:var(--wood-warm);margin-top:6px}
.footer-brand p{line-height:1.9;opacity:.75;max-width:320px}
footer ul li{margin-bottom:12px}
footer ul li a{transition:color .3s,padding-left .3s;cursor:pointer}
footer ul li a:hover{color:var(--gold-soft);padding-left:6px}
.contact-info p{margin-bottom:12px;line-height:1.8}
.copyright{padding-top:28px;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:2px;color:#7a6a51;flex-wrap:wrap;gap:14px}
.social{display:flex;gap:14px}
.social a{width:36px;height:36px;border:1px solid rgba(201,169,97,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold-soft);transition:all .3s}
.social a:hover{background:var(--gold);color:var(--wood-deep);border-color:var(--gold)}
.social svg{width:16px;height:16px}
/* Event page */
.event-hero{padding:80px 0 60px;background:var(--cream-soft);border-bottom:1px solid var(--line)}
.crumb{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;letter-spacing:3px;color:var(--wood-mid);margin-bottom:40px;display:flex;align-items:center;gap:10px}
.crumb a{cursor:pointer;transition:color .3s}.crumb a:hover{color:var(--wood-red)}
.crumb-sep{opacity:.5}
.event-hero-grid{display:grid;grid-template-columns:1fr 340px;gap:60px;align-items:start}
.event-status{display:flex;align-items:center;gap:12px;margin-bottom:24px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;letter-spacing:4px;color:var(--wood-mid)}
.status-dot{width:8px;height:8px;background:#5a9a5a;border-radius:50%;flex-shrink:0;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}
.event-hero h1{font-family:'Noto Serif TC',serif;font-weight:500;font-size:clamp(28px,3vw,40px);line-height:1.5;letter-spacing:4px;color:var(--wood-deep);margin-bottom:24px}
.event-hero h1 .en-sub{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:clamp(16px,1.6vw,20px);letter-spacing:4px;color:var(--wood-warm);margin-top:10px}
.event-lead{font-size:16px;line-height:2;color:var(--ink-soft);letter-spacing:2px;margin-bottom:36px;max-width:600px}
.event-hero-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.ehm-item{display:flex;gap:20px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line)}
.ehm-l{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:4px;color:var(--gold-bright);flex-shrink:0;min-width:32px}
.ehm-v{font-family:'Noto Serif TC',serif;font-size:15px;letter-spacing:3px;color:var(--wood-deep);font-weight:500}
.event-card{background:var(--surface);border:1px solid var(--gold);position:sticky;top:90px}
.event-card-inner{padding:32px 28px}
.card-seal{font-family:'Noto Serif TC',serif;font-size:28px;font-weight:500;letter-spacing:2px;color:var(--gold);text-align:center;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.card-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:14px;letter-spacing:2px;color:var(--ink-soft);border-bottom:1px solid var(--line)}
.card-row.small{font-size:12px;opacity:.7;border-bottom:none;padding-top:6px}
.card-row strong{font-weight:500;color:var(--wood-deep);font-family:'Noto Serif TC',serif}
.card-row .accent-red{color:var(--wood-red)}
.card-progress{height:4px;background:var(--parchment);margin:8px 0;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));transition:width .8s ease}
.btn-gold.full,.btn-outline.full{width:100%;justify-content:center;margin-top:16px;font-size:14px;padding:14px 20px}
.btn-outline{background:transparent;color:var(--wood-mid);border:1px solid var(--line);font-family:'Noto Serif TC',serif;font-size:14px;letter-spacing:6px;padding:14px 20px;display:inline-flex;align-items:center;gap:14px;transition:all .3s;cursor:pointer;justify-content:center;margin-top:10px}
.btn-outline:hover{border-color:var(--gold);color:var(--wood-deep)}
.card-contact{text-align:center;margin-top:20px;font-size:12px;letter-spacing:3px;color:var(--wood-mid);line-height:1.8}
.card-contact a{color:var(--gold-bright);font-family:'Cormorant Garamond',serif;font-size:16px}
.event-section{padding:100px 0;background:var(--surface)}
.event-section.guidelines{background:var(--cream-soft)}
.schedule{max-width:760px;margin:0 auto;position:relative}
.schedule::before{content:'';position:absolute;left:160px;top:0;bottom:0;width:1px;background:var(--line)}
.sch-row{display:grid;grid-template-columns:160px 20px 1fr;gap:20px;align-items:start;padding:24px 0;position:relative}
.sch-time{font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:4px;color:var(--gold-bright);text-align:right;padding-top:4px}
.sch-mark{width:9px;height:9px;border:1px solid var(--gold);border-radius:50%;background:var(--surface);position:relative;top:6px;transform:translateX(-4px);flex-shrink:0}
.sch-mark.highlight{background:var(--gold);border-color:var(--gold-bright)}
.sch-body h4{font-family:'Noto Serif TC',serif;font-weight:500;font-size:16px;letter-spacing:3px;color:var(--wood-deep);margin-bottom:6px}
.sch-body p{font-size:14px;color:var(--ink-soft);letter-spacing:1px;line-height:1.8}
.guide-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;max-width:1100px;margin:0 auto}
.guide-col h4{font-family:'Noto Serif TC',serif;font-weight:500;font-size:16px;letter-spacing:3px;color:var(--wood-deep);margin-bottom:20px;display:flex;align-items:center;gap:14px}
.guide-col h4 .num{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold-bright);font-style:italic}
.guide-col ul{border-top:1px solid var(--line)}
.guide-col ul li{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;letter-spacing:2px;color:var(--ink-soft);line-height:1.7}
/* Register */
.register-section{padding:100px 0;background:var(--surface)}
.register-form{max-width:760px;margin:0 auto}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.form-field{display:flex;flex-direction:column;gap:8px}
.form-field.full{margin-bottom:24px}
.form-field label{font-size:13px;letter-spacing:3px;color:var(--wood-mid);font-family:'Cormorant Garamond',serif;font-style:italic}
.form-field .req{color:var(--wood-red)}
.form-field input,.form-field select,.form-field textarea{background:var(--cream-soft);border:1px solid var(--line-strong);padding:12px 16px;font-family:'Noto Serif TC',serif;font-size:15px;color:var(--text);letter-spacing:2px;outline:none;transition:border-color .3s;resize:none}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--gold)}
.form-field.has-error input,.form-field.has-error select{border-color:var(--wood-red)}
.radios{display:flex;gap:24px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;letter-spacing:2px;color:var(--ink-soft)}
.radios input[type="radio"]{accent-color:var(--gold-bright)}
.consent{display:flex;align-items:flex-start;gap:14px;margin-bottom:32px;cursor:pointer;font-size:13px;letter-spacing:1.5px;color:var(--ink-soft);line-height:1.8}
.consent.has-error span{color:var(--wood-red)}
.consent input{accent-color:var(--gold-bright);margin-top:4px;flex-shrink:0}
.form-success{max-width:480px;margin:0 auto;text-align:center;padding:60px 40px;border:1px solid var(--gold);background:color-mix(in srgb,var(--gold-soft) 12%,var(--surface))}
.success-glyph{width:60px;height:60px;border:1px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 28px;color:var(--gold-bright)}
.success-glyph svg{width:28px;height:28px}
.form-success h3{font-family:'Noto Serif TC',serif;font-weight:500;font-size:22px;letter-spacing:5px;color:var(--wood-deep);margin-bottom:16px}
.form-success p{font-size:15px;letter-spacing:2px;color:var(--ink-soft);line-height:2}
/* Archive */
.page-hero{padding:80px 0 60px;border-bottom:1px solid var(--line)}
.archive-hero{background:var(--cream-soft)}
.page-hero-grid{display:grid;grid-template-columns:1fr 200px;gap:60px;align-items:center}
.page-hero-text h1{font-family:'Noto Serif TC',serif;font-weight:500;font-size:clamp(30px,3.5vw,48px);line-height:1.4;letter-spacing:6px;color:var(--wood-deep);margin-bottom:24px}
.page-hero-text h1 .en-sub{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(16px,1.6vw,21px);letter-spacing:4px;color:var(--wood-warm);margin-top:12px;font-weight:400}
.page-lead{font-size:15px;line-height:2;color:var(--ink-soft);letter-spacing:2px;margin-bottom:36px;max-width:600px}
.archive-stats{display:flex;gap:32px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:8px}
.stat .n{font-family:'Cormorant Garamond',serif;font-size:36px;color:var(--gold-bright)}
.stat .l{font-size:13px;letter-spacing:3px;color:var(--wood-mid)}
.seal{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--wood-mid)}
.seal svg{width:120px;height:120px}
.seal-label{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;letter-spacing:5px;color:var(--wood-warm);text-transform:uppercase}
/* Filters */
.archive-filters{padding:32px 0;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:73px;z-index:50;backdrop-filter:blur(8px)}
.filters-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.filter-group{display:flex;gap:8px;flex-wrap:wrap}
.filter{background:transparent;border:1px solid var(--line);padding:7px 18px;font-family:'Noto Serif TC',serif;font-size:13px;letter-spacing:3px;color:var(--wood-mid);cursor:pointer;transition:all .3s}
.filter:hover{border-color:var(--gold);color:var(--wood-deep)}
.filter.active{background:var(--wood-deep);color:var(--cream);border-color:var(--wood-deep)}
.filter-tools{display:flex;align-items:center;gap:20px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:8px 16px;background:var(--cream-soft)}
.search input{border:none;background:transparent;font-family:'Noto Serif TC',serif;font-size:13px;letter-spacing:2px;color:var(--text);outline:none;width:220px}
.search input::placeholder{color:var(--wood-mid);opacity:.7}
.sort{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:3px;color:var(--wood-mid)}
.sort-opt{background:none;border:none;cursor:pointer;font-size:13px;letter-spacing:3px;color:var(--wood-mid);padding:0;transition:color .3s}
.sort-opt.active,.sort-opt:hover{color:var(--wood-red)}
.sort .divider{width:1px;height:14px;background:var(--line-strong)}
/* Archive grid */
.archive-section{padding:80px 0;background:var(--surface)}
.archive-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.archive-card{display:grid;grid-template-columns:60px 1fr auto;gap:20px;align-items:start;padding:28px 24px;background:var(--cream-soft);border-bottom:1px solid var(--line);transition:background .3s}
.archive-card:hover{background:color-mix(in srgb,var(--gold-soft) 15%,var(--cream-soft))}
.ac-icon{width:48px;height:48px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold-bright);flex-shrink:0}
.ac-icon svg{width:28px;height:28px}
.ac-tag{font-size:11px;letter-spacing:4px;color:var(--wood-mid);margin-bottom:8px;font-family:'Cormorant Garamond',serif;font-style:italic}
.ac-title{font-family:'Noto Serif TC',serif;font-weight:500;font-size:15px;letter-spacing:2px;color:var(--wood-deep);margin-bottom:6px;line-height:1.5}
.ac-sub{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:2px;color:var(--wood-warm);margin-bottom:10px;line-height:1.5}
.ac-meta{display:flex;gap:14px;font-size:12px;letter-spacing:2px;color:var(--wood-mid)}
.ac-actions{display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.ac-btn{background:transparent;border:1px solid var(--line);padding:6px 14px;font-family:'Noto Serif TC',serif;font-size:12px;letter-spacing:3px;color:var(--wood-mid);cursor:pointer;transition:all .3s;white-space:nowrap}
.ac-btn:hover{background:var(--wood-deep);color:var(--cream);border-color:var(--wood-deep)}
.archive-empty{text-align:center;padding:80px 40px;max-width:400px;margin:0 auto}
.empty-glyph{width:60px;height:60px;margin:0 auto 24px;color:var(--gold);opacity:.5}
.archive-empty p{font-family:'Noto Serif TC',serif;font-size:16px;letter-spacing:4px;color:var(--wood-mid);margin-bottom:8px}
.empty-en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;letter-spacing:3px;color:var(--wood-warm)}
/* Collection */
.collection-section{padding:100px 0;background:var(--cream-soft)}
.collection-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;max-width:1200px;margin:0 auto}
.collection-item{background:var(--surface);padding:32px 24px;border-top:3px solid transparent;transition:border-color .3s,transform .4s,box-shadow .4s;position:relative;cursor:pointer}
.collection-item::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--gold-soft) 30%,transparent),transparent 60%);opacity:0;transition:opacity .4s}
.collection-item:hover{border-color:var(--gold);transform:translateY(-4px);box-shadow:0 20px 40px -16px rgba(61,36,19,.25)}
.collection-item:hover::before{opacity:1}
.col-num{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;letter-spacing:4px;color:var(--gold-bright);margin-bottom:16px}
.col-title{font-family:'Noto Serif TC',serif;font-weight:500;font-size:16px;letter-spacing:4px;color:var(--wood-deep);margin-bottom:10px;line-height:1.5}
.col-sub{font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--wood-warm);letter-spacing:2px;line-height:1.6;margin-bottom:12px}
.col-meta{font-size:12px;letter-spacing:3px;color:var(--wood-mid)}
/* Tweaks panel */
.tweaks-panel{position:fixed;right:22px;bottom:22px;z-index:200;width:280px;background:var(--surface);border:1px solid var(--gold);box-shadow:0 30px 60px -20px rgba(0,0,0,.4);font-family:'Noto Serif TC',serif;color:var(--text);animation:tweakIn .4s cubic-bezier(.2,.9,.3,1)}
@keyframes tweakIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.tweaks-panel.hidden{display:none}
.tweaks-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--cream-soft);font-family:'Cormorant Garamond',serif;font-style:italic;letter-spacing:5px;text-transform:uppercase;font-size:14px;color:var(--wood-deep)}
.tweaks-head button{background:none;border:none;cursor:pointer;font-size:22px;line-height:1;color:var(--wood-mid)}
.tweaks-body{padding:18px}
.tweaks-group+.tweaks-group{margin-top:20px}
.tweaks-label{display:block;font-size:11px;letter-spacing:4px;color:var(--wood-mid);text-transform:uppercase;margin-bottom:12px;font-family:'Cormorant Garamond',serif;font-style:italic}
.tweaks-swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw{position:relative;aspect-ratio:1;border:1px solid var(--line);cursor:pointer;background:transparent;transition:transform .3s,border-color .3s,box-shadow .3s;display:flex;align-items:flex-end;justify-content:center;padding:6px;overflow:hidden}
.sw span{position:relative;z-index:2;font-family:'Noto Serif TC',serif;font-size:11px;letter-spacing:3px;color:var(--wood-deep);padding:2px 6px;background:rgba(255,255,255,.8);border-radius:2px}
.sw::before{content:'';position:absolute;inset:0}
.sw::after{content:'';position:absolute;inset:20% 20% 45% 20%}
.sw-cream::before{background:#F7F0DE}.sw-cream::after{background:linear-gradient(180deg,#C9A961,#3D2413)}
.sw-paper::before{background:#F5EFE2}.sw-paper::after{background:#2A241B}
.sw-crimson::before{background:#F4E9D8}.sw-crimson::after{background:linear-gradient(180deg,#C9A961,#4A1010)}
.sw:hover{transform:translateY(-2px)}
.sw.active{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 40%,transparent)}
/* Page transition */
.page-enter{animation:pageIn .45s cubic-bezier(.2,.9,.3,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* Responsive */
@media(max-width:1000px){.hero-inner,.event-hero-grid,.page-hero-grid{grid-template-columns:1fr}.hero-image{max-width:460px;margin:0 auto}.news-grid{grid-template-columns:repeat(2,1fr)}.footer-grid{grid-template-columns:1fr 1fr;gap:40px}.collection-grid{grid-template-columns:repeat(3,1fr)}.archive-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){nav ul{display:none;position:fixed;top:73px;left:0;right:0;background:var(--surface-dark);flex-direction:column;padding:20px;gap:0;z-index:99;border-top:1px solid var(--line)}nav.open ul{display:flex}nav.open ul li a{color:var(--gold-soft);padding:14px 20px;display:block;letter-spacing:4px}.menu-btn{display:flex}}
@media(max-width:720px){.container,.topbar-inner,.nav-wrap,.hero-inner{padding-left:22px;padding-right:22px}.news-grid,.guide-grid{grid-template-columns:1fr}.footer-grid{grid-template-columns:1fr}.qa-row{grid-template-columns:1fr;gap:14px}.qa-date{padding-top:0}.qa-answer{padding-left:44px;padding-right:0}.qa-answer .qa-a-mark{left:0}.qa-arrow{justify-self:start}.topbar-inner .left{display:none}section{padding:70px 0}.archive-grid{grid-template-columns:1fr}.collection-grid{grid-template-columns:1fr 1fr}.event-hero-meta{grid-template-columns:1fr}.filters-row{flex-direction:column;align-items:flex-start}.schedule::before{left:100px}.sch-row{grid-template-columns:100px 16px 1fr}}
</style>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="scripts/shared.jsx"></script>
<script type="text/babel" src="scripts/home.jsx"></script>
<script type="text/babel" src="scripts/event.jsx"></script>
<script type="text/babel" src="scripts/archive.jsx"></script>
<script type="text/babel" src="scripts/downloads.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "cream",
  "lang": "zh-Hant"
}/*EDITMODE-END*/;

function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem('dabei-state') || '{}'); } catch(e){ return {}; } })();
  const [page, setPage] = useState(saved.page || 'home');
  const [theme, setTheme] = useState(saved.theme || TWEAK_DEFAULTS.theme);
  const [lang, setLang] = useState(saved.lang || TWEAK_DEFAULTS.lang);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [pageKey, setPageKey] = useState(0);

  useEffect(() => {
    document.body.setAttribute('data-theme', theme);
    document.body.setAttribute('data-lang', lang);
    localStorage.setItem('dabei-state', JSON.stringify({ page, theme, lang }));
  }, [page, theme, lang]);

  useEffect(() => {
    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  function navigate(p) {
    setPage(p);
    setPageKey(k => k + 1);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  const navVal = { page, setPage: navigate };
  const themeVal = { theme, setTheme };

  return (
    <window.NavContext.Provider value={navVal}>
      <window.ThemeContext.Provider value={themeVal}>
        <window.LangContext.Provider value={lang}>
          {page === 'home' && <window.MuralBanner />}
          <window.TopBar lang={lang} setLang={l => { setLang(l); }} />
          <window.Header lang={lang} setLang={setLang} />
          <main key={pageKey} className="page-enter">
            {page === 'home'      && <window.HomePage />}
            {page === 'event'     && <window.EventPage />}
            {page === 'archive'   && <window.ArchivePage />}
            {page === 'downloads' && <window.DownloadsPage />}
          </main>
          <window.Footer />

          {/* Tweaks */}
          {tweaksOpen && (
            <div className="tweaks-panel">
              <div className="tweaks-head">
                <span>Tweaks</span>
                <button onClick={() => setTweaksOpen(false)}>×</button>
              </div>
              <div className="tweaks-body">
                <div className="tweaks-group">
                  <label className="tweaks-label">Color theme</label>
                  <div className="tweaks-swatches">
                    {[['cream','繁華'],['paper','紙墨'],['crimson','朱砂']].map(([v,l]) => (
                      <button key={v} className={`sw sw-${v}${theme===v?' active':''}`} onClick={() => {
                        setTheme(v);
                        window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ theme:v } }, '*');
                      }}><span>{l}</span></button>
                    ))}
                  </div>
                </div>
                <div className="tweaks-group">
                  <label className="tweaks-label">Language</label>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'10px'}}>
                    {[['zh-Hant','繁體'],['zh-Hans','简体'],['en','English']].map(([v,l]) => (
                      <button key={v} onClick={() => { setLang(v); window.parent.postMessage({type:'__edit_mode_set_keys',edits:{lang:v}},'*'); }}
                        style={{padding:'6px 4px',background: lang===v ? 'var(--wood-deep)' : 'transparent',color: lang===v ? 'var(--cream)' : 'var(--wood-mid)',border:'1px solid var(--line)',cursor:'pointer',fontFamily:'Noto Serif TC',fontSize:'11px',letterSpacing:'1px',transition:'all .3s',textAlign:'center',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                        {l}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}
        </window.LangContext.Provider>
      </window.ThemeContext.Provider>
    </window.NavContext.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
